name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          attestation: true
          go-version: '1.26.5'
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
